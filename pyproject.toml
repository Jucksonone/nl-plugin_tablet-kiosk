[project]
name = "nl-plugin-tablet_kiosk"
version = "0.1.0"
description = "Natural Land plugin: Tablet kiosk (stimulus screen, camera, microphones and touch of a Linux tablet)"
requires-python = ">=3.11,<3.12"
dependencies = ["natural-land-plugin-sdk", "httpx>=0.27"]

[project.scripts]
# Started by the platform (plugin.json backend.command); main() migrates, then serves.
nl-plugin-tablet_kiosk = "nl_plugin_tablet_kiosk.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nl_plugin_tablet_kiosk" = ["migrations/*.sql"]

[tool.uv.sources]
# The platform's SDK, copied into .platform/ by `nl-plugin sync` (not committed).
natural-land-plugin-sdk = { path = ".platform/sdk/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# `uv run pytest` skips the tests that need a real database; `nl-plugin verify` runs them on its temporary platform.
addopts = "-m 'not platform'"
markers = ["platform: needs the temporary platform of nl-plugin verify (real database, the plugin's role)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
