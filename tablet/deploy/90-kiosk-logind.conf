# Kiosk: hardware keys must not turn the tablet off by accident.
# In the Xfce desktop the power manager handles these keys; the kiosk session has
# none, so systemd-logind's defaults (short press = power off) would apply.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
