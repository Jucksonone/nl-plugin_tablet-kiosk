# Echo cancellation: play through "echo-cancel-sink", record from
# "echo-cancel-source"; the WebRTC AEC removes the playback from the mic signal.
#
# The targets are pinned to the tablet's built-in RT5651 codec. Without them
# WirePlumber routes the playback side to the (unconnected) HDMI output and
# nothing is heard.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name   = aec/libspa-aec-webrtc
            node.latency   = 1024/48000
            # No automatic gain control: keep recorded levels as they are (it also
            # amplifies whatever echo is left). Noise suppression stays on.
            aec.args = { webrtc.gain_control = false }
            capture.props  = { node.name = "echo-cancel-capture"  node.passive = true
                               target.object = "alsa_input.platform-bytcr_rt5651.HiFi__hw_rt5651__source" }
            source.props   = { node.name = "echo-cancel-source"   node.description = "Echo-cancelled microphone" }
            sink.props     = { node.name = "echo-cancel-sink"     node.description = "Echo-cancel playback" }
            playback.props = { node.name = "echo-cancel-playback" node.passive = true
                               target.object = "alsa_output.platform-bytcr_rt5651.HiFi__hw_rt5651__sink" }
        }
    }
]
